<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Offline Kit icon. app/icon.png is this drawing rendered at 1024x1024; setup.py puts it on the Desktop shortcut. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8b63"/>
      <stop offset="1" stop-color="#1f4f38"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ebdc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2318" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824x824 rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- open book -->
  <g filter="url(#soft)">
    <!-- page edges underneath -->
    <path d="M512 486 C 444 446 336 438 236 458 L 236 760 C 336 742 444 750 512 792 C 580 750 688 742 788 760 L 788 458 C 688 438 580 446 512 486 Z" fill="#d9ccae"/>
    <!-- left page -->
    <path d="M512 462 C 444 420 340 410 252 428 L 252 732 C 340 716 444 724 512 768 Z" fill="url(#page)"/>
    <!-- right page -->
    <path d="M512 462 C 580 420 684 410 772 428 L 772 732 C 684 716 580 724 512 768 Z" fill="url(#page)"/>
  </g>
  <!-- spine -->
  <path d="M512 462 L 512 768" stroke="#c9bb98" stroke-width="6" stroke-linecap="round"/>
  <!-- text lines -->
  <g stroke="#b9c9bd" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M300 504 C 360 494 420 498 464 516"/>
    <path d="M300 564 C 360 554 420 558 464 576"/>
    <path d="M300 624 C 360 614 420 618 464 636"/>
    <path d="M724 504 C 664 494 604 498 560 516"/>
    <path d="M724 564 C 664 554 604 558 560 576"/>
    <path d="M724 624 C 664 614 604 618 560 636"/>
  </g>

  <!-- sparkle (the assistant) -->
  <g fill="#f5bf42">
    <path d="M512 184 Q 524 292 624 304 Q 524 316 512 424 Q 500 316 400 304 Q 500 292 512 184 Z"/>
    <path d="M672 206 Q 677 250 718 255 Q 677 260 672 304 Q 667 260 626 255 Q 667 250 672 206 Z"/>
  </g>
</svg>
